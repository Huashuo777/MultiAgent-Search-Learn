<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiAgent-Search — 电商运营智能分析</title>

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #0f1117;
    --panel: #161822;
    --border: #252836;
    --text: #e1e4ed;
    --text-dim: #7b8198;

    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,.18);

    --green: #22c55e;
    --green-bg: rgba(34,197,94,.12);

    --blue: #3b82f6;
    --blue-bg: rgba(59,130,246,.12);

    --orange: #f59e0b;
    --orange-bg: rgba(245,158,11,.12);

    --red: #ef4444;
    --red-bg: rgba(239,68,68,.12);

    --purple: #a855f7;
    --purple-bg: rgba(168,85,247,.12);

    --radius: 10px;

    --font:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Noto Sans SC",
      "PingFang SC",
      "Microsoft YaHei",
      sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── header ── */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.3px;
  }

  header h1 span {
    color: var(--accent);
  }

  .ws-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .ws-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .ws-dot.off {
    background: var(--red);
  }

  /* ── input bar ── */

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-bar input {
    flex: 1;
    padding: 11px 14px;
    font-size: 14px;
    font-family: var(--font);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }

  .input-bar input:focus {
    border-color: var(--accent);
  }

  .input-bar input::placeholder {
    color: #4a5070;
  }

  .btn {
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .btn-primary:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-weight: 500;
  }

  .btn-ghost:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .btn-ghost.active {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(99,102,241,.08);
  }

  /* ── tab bar ── */

  .tab-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
    min-height: 42px;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-dim);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
    border: 1px solid transparent;
    user-select: none;
    flex-shrink: 0;
  }

  .tab:hover {
    color: var(--text);
    background: rgba(255,255,255,.03);
  }

  .tab.active {
    color: var(--text);
    background: var(--panel);
    border-color: var(--border);
    border-bottom-color: var(--panel);
    margin-bottom: -1px;
  }

  .tab .tab-query {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab .tab-status {
    font-size: 11px;
  }

  .tab .tab-status.running {
    color: var(--blue);
  }

  .tab .tab-status.done {
    color: var(--green);
  }

  .tab .tab-status.error {
    color: var(--red);
  }

  .tab .tab-close {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-dim);
    transition: all .1s;
    margin-left: 2px;
  }

  .tab .tab-close:hover {
    background: rgba(255,255,255,.1);
    color: var(--text);
  }

  /* ── main content ── */

  .main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .log-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .log-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px 20px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    gap: 8px;
  }

  .empty-state .icon {
    font-size: 36px;
    opacity: .3;
  }

  /* ── log entries ── */

  .log-entry {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(37,40,54,.4);
    font-size: 13px;
    line-height: 1.5;
    animation: fadeIn .2s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .log-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .log-dot.s {
    background: var(--orange);
    box-shadow: 0 0 5px rgba(245,158,11,.5);
  }

  .log-dot.a {
    background: var(--blue);
    box-shadow: 0 0 5px rgba(59,130,246,.5);
  }

  .log-dot.t {
    background: var(--green);
    box-shadow: 0 0 5px rgba(34,197,94,.5);
  }

  .log-dot.r {
    background: var(--purple);
    box-shadow: 0 0 5px rgba(168,85,247,.5);
  }

  .log-dot.e {
    background: var(--red);
    box-shadow: 0 0 5px rgba(239,68,68,.5);
  }

  .log-dot.u {
    background: var(--accent);
    box-shadow: 0 0 5px rgba(99,102,241,.5);
  }

  .log-body {
    flex: 1;
    min-width: 0;
  }

  .log-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-right: 6px;
    vertical-align: middle;
  }

  .log-tag.s {
    color: var(--orange);
    background: var(--orange-bg);
  }

  .log-tag.a {
    color: var(--blue);
    background: var(--blue-bg);
  }

  .log-tag.t {
    color: var(--green);
    background: var(--green-bg);
  }

  .log-tag.r {
    color: var(--purple);
    background: var(--purple-bg);
  }

  .log-tag.e {
    color: var(--red);
    background: var(--red-bg);
  }

  .log-tag.u {
    color: var(--accent);
    background: var(--accent-glow);
  }

  .log-msg {
    color: var(--text);
    word-break: break-word;
  }

  .log-time {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .log-result-block {
    margin-top: 4px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 5px;
    border-left: 3px solid var(--purple);
    font-size: 12px;
    line-height: 1.6;
    max-height: 220px;
    overflow-y: auto;
    color: var(--text-dim);
    white-space: pre-wrap;
  }

  /* ── user message ── */

  .user-message-block {
    margin-top: 4px;
    padding: 8px 10px;
    background: rgba(99,102,241,.06);
    border-left: 3px solid var(--accent);
    border-radius: 5px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
  }

  /* ── file panel ── */

  .file-panel {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--panel);
  }

  .file-panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .file-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .12s;
    margin-bottom: 2px;
  }

  .file-item:hover {
    background: rgba(255,255,255,.04);
  }

  .file-icon {
    font-size: 18px;
    flex-shrink: 0;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-meta {
    font-size: 11px;
    color: var(--text-dim);
  }

  .file-item .btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 5px;
  }

  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
  }
</style>
</head>

<body>

<header>
  <h1>🤖 MultiAgent <span>Search</span></h1>

  <div class="ws-badge">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsStatus">就绪</span>
  </div>
</header>

<div class="input-bar">

  <input
    id="queryInput"
    type="text"
    placeholder="输入分析问题，例如：帮我分析最近电商行业的热门品类趋势"
  />

  <button
    class="btn btn-primary"
    id="sendBtn"
    onclick="sendTask()"
  >
    ▶ 新建会话
  </button>

  <button
    class="btn btn-ghost"
    id="newSessionBtn"
    onclick="newSession()"
  >
    ＋ 新建会话
  </button>

  <button
    class="btn btn-ghost"
    onclick="closeAllSessions()"
  >
    清除全部
  </button>

</div>

<div class="tab-bar" id="tabBar"></div>

<div class="main-area">

  <div class="log-panel">
    <div class="log-scroll" id="logArea"></div>
  </div>

  <div class="file-panel">

    <div class="file-panel-header">
      <span>生成的报告</span>

      <button
        class="btn btn-ghost"
        onclick="refreshFiles()"
        style="padding:3px 9px;font-size:10px;"
      >
        刷新
      </button>
    </div>

    <div class="file-list" id="fileList"></div>

  </div>

</div>

<script>

// ============================================================
// 会话管理
// ============================================================

const sessions = {};
// {
//   threadId: {
//     id,
//     query,
//     logs[],
//     ws,
//     dir,
//     status,
//     element
//   }
// }

let activeSessionId = null;
let fileRefreshTimer = null;


// ============================================================
// DOM 工具
// ============================================================

const $ = s => document.querySelector(s);

const $$ = s => document.querySelectorAll(s);


// ============================================================
// 日志类型
// ============================================================

const tagMap = {

  user_message: {
    dot: 'u',
    tag: 'u',
    text: '用户'
  },

  session_created: {
    dot: 's',
    tag: 's',
    text: '会话'
  },

  assistant_call: {
    dot: 'a',
    tag: 'a',
    text: '调度'
  },

  tool_start: {
    dot: 't',
    tag: 't',
    text: '工具'
  },

  task_result: {
    dot: 'r',
    tag: 'r',
    text: '完成'
  },

  error: {
    dot: 'e',
    tag: 'e',
    text: '错误'
  }

};


// ============================================================
// 新建前端会话对象
// ============================================================

function createSession(threadId, query) {

  const session = {

    id: threadId,

    // 第一轮问题作为 Tab 标题
    query: query,

    // 前端日志
    logs: [],

    // websocket
    ws: null,

    // 输出目录
    dir: null,

    // running | done | error
    status: 'running',

    el: null,

    _scrollTop: 0

  };

  sessions[threadId] = session;


  // 建立 WebSocket
  connectSessionWebSocket(session);


  // 切换到当前会话
  switchSession(threadId);

  renderTabs();

  scheduleFileRefresh();

  return session;
}


// ============================================================
// 建立 / 重连 WebSocket
// ============================================================

function connectSessionWebSocket(session) {

  // 已经连接
  if (
    session.ws &&
    (
      session.ws.readyState === WebSocket.OPEN ||
      session.ws.readyState === WebSocket.CONNECTING
    )
  ) {
    return Promise.resolve();
  }

  const proto =
    location.protocol === 'https:'
      ? 'wss:'
      : 'ws:';

  const url =
    `${proto}//${location.host}/ws/${session.id}`;


  return new Promise((resolve, reject) => {

    const ws = new WebSocket(url);

    session.ws = ws;

    let opened = false;


    ws.onopen = () => {

      opened = true;

      updateWSStatus();
      updateComposer();

      resolve();
    };


    ws.onmessage = (e) => {

      try {

        const d = JSON.parse(e.data);

        // 心跳响应
        if (d.type === 'pong') {
          return;
        }

        // 只处理 monitor_event
        if (d.type !== 'monitor_event') {
          return;
        }


        session.logs.push({

          event: d.event,

          message: d.message,

          data: d.data,

          timestamp: d.timestamp

        });


        // 会话创建
        if (
          d.event === 'session_created' &&
          d.data?.path
        ) {

          session.dir = d.data.path;

          scheduleFileRefresh();
        }


        // Agent 完成
        if (d.event === 'task_result') {

          session.status = 'done';

          scheduleFileRefresh();
        }


        // Agent 出错
        if (d.event === 'error') {

          session.status = 'error';
        }


        renderTabs();

        updateComposer();


        if (
          activeSessionId === session.id
        ) {

          renderLog(session);
        }

      } catch (_) {

        // 忽略非法 websocket 数据

      }

    };


    ws.onclose = () => {

      /*
       * 注意：
       * 不因为 websocket 关闭就强制把 Agent 标记为 done。
       * 如果任务实际仍然在运行，保持 running 状态。
       */

      updateWSStatus();

      renderTabs();

      updateComposer();

      if (!opened) {

        reject(
          new Error('WebSocket 连接失败')
        );

      }

    };


    ws.onerror = () => {

      if (!opened) {

        reject(
          new Error('WebSocket 连接错误')
        );
      }

      updateWSStatus();

      renderTabs();

      updateComposer();

    };

  });

}


// ============================================================
// 切换会话
// ============================================================

function switchSession(threadId) {

  // 保存当前会话滚动位置
  if (
    activeSessionId &&
    sessions[activeSessionId]
  ) {

    const area = $('#logArea');

    sessions[activeSessionId]._scrollTop =
      area.scrollTop;

  }


  activeSessionId = threadId;


  const s = sessions[threadId];


  if (!s) {

    renderLog(null);

    updateComposer();

    return;
  }


  renderLog(s);


  $('#logArea').scrollTop =
    s._scrollTop || 0;


  renderTabs();

  updateComposer();

  refreshFiles();

}


// ============================================================
// 主动创建“空白新会话”
// ============================================================

function newSession() {

  /*
   * 注意：
   * 这里只是让 activeSessionId 变成 null。
   *
   * 真正的 thread_id 会在用户发送第一条消息时，
   * 由后端 /api/task 创建。
   *
   * 原来的会话不会被删除。
   */

  activeSessionId = null;

  renderLog(null);

  renderTabs();

  updateWSStatus();

  updateComposer();

  refreshFiles();


  const input = $('#queryInput');

  input.value = '';

  input.placeholder =
    '输入新的任务，例如：帮我分析最近电商行业的热门品类趋势';

  input.focus();

}


// ============================================================
// 关闭单个会话
// ============================================================

function closeSession(threadId) {

  const s = sessions[threadId];

  if (!s) {
    return;
  }


  if (s.ws) {

    s.ws.close();

    s.ws = null;

  }


  delete sessions[threadId];


  // 如果关闭的是当前会话
  if (activeSessionId === threadId) {

    const ids = Object.keys(sessions);


    if (ids.length > 0) {

      // 切换到最新一个
      switchSession(
        ids[ids.length - 1]
      );

    } else {

      activeSessionId = null;

      renderLog(null);

      updateComposer();

    }

  }


  renderTabs();

  updateWSStatus();

}


// ============================================================
// 清除全部会话
// ============================================================

function closeAllSessions() {

  Object.keys(sessions).forEach(id => {

    if (sessions[id].ws) {

      sessions[id].ws.close();

    }

  });


  Object.keys(sessions).forEach(id => {

    delete sessions[id];

  });


  activeSessionId = null;


  renderLog(null);

  renderTabs();

  updateWSStatus();

  updateComposer();

}


// ============================================================
// Tab 渲染
// ============================================================

function renderTabs() {

  const bar = $('#tabBar');

  const ids = Object.keys(sessions);


  if (ids.length === 0) {

    bar.innerHTML = '';

    return;
  }


  bar.innerHTML = ids.map(id => {

    const s = sessions[id];

    const active =
      id === activeSessionId
        ? ' active'
        : '';


    const statusIcon =
      s.status === 'running'
        ? '⏳'
        : s.status === 'error'
          ? '❌'
          : '✅';


    return `
      <div
        class="tab${active}"
        onclick="switchSession('${id}')"
      >

        <span
          class="tab-status ${s.status}"
        >
          ${statusIcon}
        </span>

        <span
          class="tab-query"
          title="${escapeAttr(s.query)}"
        >
          ${
            escapeHtml(
              s.query.substring(0, 20)
            )
          }${s.query.length > 20 ? '...' : ''}
        </span>

        <span
          class="tab-close"
          onclick="
            event.stopPropagation();
            closeSession('${id}')
          "
        >
          ×
        </span>

      </div>
    `;

  }).join('');

}


// ============================================================
// 在当前会话中加入用户消息
// ============================================================

function appendUserMessage(session, query) {

  session.logs.push({

    event: 'user_message',

    message: query,

    data: {
      result: query
    },

    timestamp: new Date().toISOString()

  });


  if (activeSessionId === session.id) {

    renderLog(session);

  }

}


// ============================================================
// 日志渲染
// ============================================================

function renderLog(session) {

  const area = $('#logArea');


  if (
    !session ||
    session.logs.length === 0
  ) {

    area.innerHTML = `
      <div class="empty-state">

        <div class="icon">📋</div>

        <div>
          ${
            session
              ? '等待 Agent 响应...'
              : '发送一个任务开始调试'
          }
        </div>

      </div>
    `;

    return;
  }


  area.innerHTML =
    session.logs.map(l => {

      const t =
        tagMap[l.event] ||
        tagMap.tool_start;


      /*
       * 用户消息使用单独样式
       */
      if (l.event === 'user_message') {

        return `
          <div class="log-entry">

            <div class="log-dot u"></div>

            <div class="log-body">

              <span class="log-tag u">
                用户
              </span>

              <div class="user-message-block">
                ${escapeHtml(l.message)}
              </div>

              <div class="log-time">
                ${fmtTime(l.timestamp)}
              </div>

            </div>

          </div>
        `;

      }


      /*
       * 普通 monitor 日志
       */

      const resultBlock =
        l.data?.result
          ? `
            <div class="log-result-block">
              ${
                escapeHtml(
                  l.data.result.substring(
                    0,
                    3000
                  )
                )
              }${
                l.data.result.length > 3000
                  ? '…'
                  : ''
              }
            </div>
          `
          : '';


      return `
        <div class="log-entry">

          <div class="log-dot ${t.dot}"></div>

          <div class="log-body">

            <span class="log-tag ${t.tag}">
              ${t.text}
            </span>

            <span class="log-msg">
              ${escapeHtml(l.message)}
            </span>

            ${resultBlock}

            <div class="log-time">
              ${fmtTime(l.timestamp)}
            </div>

          </div>

        </div>
      `;

    }).join('');


  /*
   * 自动滚动到底部
   */

  area.scrollTop =
    area.scrollHeight;

}


// ============================================================
// 更新输入区域状态
// ============================================================

function updateComposer() {

  const input = $('#queryInput');

  const btn = $('#sendBtn');

  const session =
    activeSessionId
      ? sessions[activeSessionId]
      : null;


  /*
   * 没有当前会话
   *
   * 下一条消息 = 创建新会话
   */

  if (!session) {

    input.placeholder =
      '输入新的任务，例如：帮我分析最近电商行业的热门品类趋势';

    btn.textContent =
      '▶ 新建会话';

    btn.disabled = false;

    return;

  }


  /*
   * 当前会话正在运行
   */

  if (session.status === 'running') {

    input.placeholder =
      '当前任务正在执行，请等待完成后继续对话...';

    btn.textContent =
      '⏳ 执行中';

    btn.disabled = true;

    return;

  }


  /*
   * 当前会话已经完成
   */

  if (session.status === 'done') {

    input.placeholder =
      '继续当前会话，例如：再详细分析一下刚才提到的消费者...';

    btn.textContent =
      '▶ 继续对话';

    btn.disabled = false;

    return;

  }


  /*
   * 当前会话发生错误
   */

  if (session.status === 'error') {

    input.placeholder =
      '当前会话上一次执行失败，可以重新发送或新建会话';

    btn.textContent =
      '▶ 重新发送';

    btn.disabled = false;

    return;

  }

}


// ============================================================
// 发送任务
// ============================================================

async function sendTask() {

  const input = $('#queryInput');

  const query =
    input.value.trim();


  if (!query) {
    return;
  }


  const btn =
    $('#sendBtn');


  /*
   * ----------------------------------------------------------
   * 情况 1：
   * 当前没有 activeSessionId
   *
   * → 创建新会话
   * ----------------------------------------------------------
   */

  if (!activeSessionId) {

    btn.disabled = true;

    btn.textContent =
      '创建中...';


    try {

      const res =
        await fetch('/api/task', {

          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            query: query
          })

        });


      if (!res.ok) {

        throw new Error(
          `HTTP ${res.status}`
        );

      }


      const data =
        await res.json();


      if (!data.thread_id) {

        throw new Error(
          '服务器没有返回 thread_id'
        );

      }


      /*
       * 创建本地会话
       */

      const session =
        createSession(
          data.thread_id,
          query
        );


      /*
       * 前端记录用户第一轮问题
       */

      appendUserMessage(
        session,
        query
      );


      /*
       * 清空输入框
       */

      input.value = '';


      input.focus();


    } catch (err) {

      alert(
        '请求失败: ' +
        err.message
      );

    } finally {

      updateComposer();

    }


    return;
  }


  /*
   * ----------------------------------------------------------
   * 情况 2：
   * 当前存在 activeSessionId
   *
   * → 继续已有会话
   * → 必须把 thread_id 发给后端
   * ----------------------------------------------------------
   */

  const session =
    sessions[activeSessionId];


  if (!session) {

    activeSessionId = null;

    updateComposer();

    return;

  }


  /*
   * 当前任务还没结束
   *
   * 禁止对同一个 thread 并发提交任务
   */

  if (session.status === 'running') {

    alert(
      '当前会话仍在执行，请等待这一轮完成后再继续。'
    );

    return;

  }


  btn.disabled = true;

  btn.textContent =
    '发送中...';


  try {

    /*
     * 如果 websocket 已经断开，
     * 先尝试重新连接。
     */

    if (
      !session.ws ||
      session.ws.readyState !== WebSocket.OPEN
    ) {

      await connectSessionWebSocket(
        session
      );

    }


    /*
     * 把当前会话切换到 running
     */

    session.status =
      'running';


    renderTabs();

    updateComposer();


    /*
     * 向后端发送：
     *
     * {
     *   query: "...",
     *   thread_id: "原来的 UUID"
     * }
     *
     * 这才会让 LangGraph 使用原来的 checkpoint。
     */

    const res =
      await fetch('/api/task', {

        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body: JSON.stringify({

          query: query,

          thread_id: session.id

        })

      });


    if (!res.ok) {

      throw new Error(
        `HTTP ${res.status}`
      );

    }


    const data =
      await res.json();


    /*
     * 确认后端仍然使用同一个 thread_id
     */

    if (
      data.thread_id &&
      data.thread_id !== session.id
    ) {

      throw new Error(
        '服务器返回了不同的 thread_id，无法继续当前会话'
      );

    }


    /*
     * 前端显示用户这一轮的问题
     */

    appendUserMessage(
      session,
      query
    );


    /*
     * 清空输入框
     */

    input.value = '';

    input.focus();


  } catch (err) {

    /*
     * 请求失败
     */

    session.status =
      'error';


    renderTabs();

    updateComposer();


    alert(
      '继续会话失败: ' +
      err.message
    );

  }

}


// ============================================================
// WebSocket 状态
// ============================================================

function updateWSStatus() {

  const ids =
    Object.keys(sessions);


  const hasActive =
    ids.some(id => {

      const ws =
        sessions[id].ws;

      return (
        ws &&
        ws.readyState ===
          WebSocket.OPEN
      );

    });


  const dot =
    $('#wsDot');

  const txt =
    $('#wsStatus');


  dot.className =
    'ws-dot' +
    (
      hasActive
        ? ''
        : ' off'
    );


  txt.textContent =
    ids.length === 0
      ? '就绪'
      : `${ids.length} 个会话${
          hasActive
            ? ' · 已连接'
            : ''
        }`;

}


// ============================================================
// 文件刷新
// ============================================================

function scheduleFileRefresh() {

  if (fileRefreshTimer) {

    clearTimeout(
      fileRefreshTimer
    );

  }


  fileRefreshTimer =
    setTimeout(
      refreshFiles,
      3000
    );

}


// ============================================================
// 文件列表
// ============================================================

async function refreshFiles() {

  const list =
    $('#fileList');


  try {

    const res =
      await fetch('/api/files');


    const d =
      await res.json();


    if (
      d.error ||
      !d.files ||
      d.files.length === 0
    ) {

      list.innerHTML = `
        <div class="empty-state">

          <div class="icon">📂</div>

          <div>
            还未生成文件
          </div>

        </div>
      `;

      return;
    }


    /*
     * 当前 active session 对应的文件夹
     */

    const currentDir =
      activeSessionId
        ? `session_${activeSessionId}`
        : null;


    const files =
      d.files;


    /*
     * 按 session 文件夹分组
     */

    const groups = {};


    files.forEach(f => {

      const parts =
        f.path
          .replace(/\\/g, '/')
          .split('/');


      const idx =
        parts.findIndex(
          p => p.startsWith('session_')
        );


      const grp =
        idx >= 0
          ? parts[idx]
          : '其他';


      if (!groups[grp]) {

        groups[grp] = [];

      }


      groups[grp].push(f);

    });


    /*
     * 当前会话排最前面
     */

    const sorted =
      Object.entries(groups)
        .sort((a, b) => {

          if (a[0] === currentDir) {
            return -1;
          }

          if (b[0] === currentDir) {
            return 1;
          }

          return b[0]
            .localeCompare(
              a[0]
            );

        });


    let html = '';


    sorted.forEach(
      ([grp, fs]) => {

        const isActive =
          grp === currentDir;


        html += `
          <div
            style="
              font-size:10px;
              color:var(--text-dim);
              padding:6px 10px 2px;
              letter-spacing:.5px;
              ${
                isActive
                  ? 'color:var(--accent);'
                  : ''
              }
            "
          >
            ${
              isActive
                ? '▸ '
                : ''
            }${escapeHtml(grp)}
          </div>
        `;


        fs.forEach(f => {

          /*
           * 注意：
           *
           * 这里不再提前 encodeURIComponent。
           *
           * downloadFile() 中只编码一次。
           *
           * 修复：
           * 原来这里编码一次，
           * downloadFile() 又编码一次，
           * 导致 %2F -> %252F。
           */

          html += `
            <div class="file-item">

              <div class="file-icon">
                ${iconFor(f.name)}
              </div>

              <div class="file-info">

                <div
                  class="file-name"
                  title="${escapeAttr(f.name)}"
                >
                  ${escapeHtml(f.name)}
                </div>

                <div class="file-meta">
                  ${fmtSize(f.size)}
                  ·
                  ${
                    new Date(
                      f.mtime * 1000
                    ).toLocaleString(
                      'zh-CN'
                    )
                  }
                </div>

              </div>

              <button
                class="btn btn-primary"
                data-path="${escapeAttr(f.path)}"
                onclick="
                  event.stopPropagation();
                  downloadFile(this.dataset.path)
                "
              >
                下载
              </button>

            </div>
          `;

        });

      }
    );


    list.innerHTML =
      html;


  } catch (_) {

    /*
     * 文件列表失败时不打断整个页面
     */

  }

}


// ============================================================
// 文件下载
// ============================================================

function downloadFile(p) {

  /*
   * 这里只 encode 一次。
   */

  window.open(
    `/api/download?path=${encodeURIComponent(p)}`,
    '_blank'
  );

}


// ============================================================
// 工具函数
// ============================================================

function escapeHtml(s) {

  if (!s) {
    return '';
  }

  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

}


function escapeAttr(s) {

  if (!s) {
    return '';
  }

  return s
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

}


function fmtTime(iso) {

  try {

    return new Date(
      iso
    ).toLocaleTimeString(
      'zh-CN',
      {
        hour12: false
      }
    );

  } catch (_) {

    return '';

  }

}


function fmtSize(b) {

  if (!b) {
    return '0 B';
  }


  const u = [
    'B',
    'KB',
    'MB',
    'GB'
  ];


  let i = 0;


  while (
    b >= 1024 &&
    i < 3
  ) {

    b /= 1024;

    i++;

  }


  return (
    b.toFixed(
      i > 0
        ? 1
        : 0
    )
    +
    ' '
    +
    u[i]
  );

}


function iconFor(n) {

  if (n.endsWith('.md')) {
    return '📝';
  }

  if (n.endsWith('.pdf')) {
    return '📄';
  }

  return '📎';

}


// ============================================================
// 键盘
// ============================================================

$('#queryInput').addEventListener(
  'keydown',
  e => {

    /*
     * Enter：发送
     *
     * Shift + Enter：
     * 暂不处理多行，因为当前输入框仍然是 input。
     */

    if (
      e.key === 'Enter' &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendTask();

    }

  }
);


// ============================================================
// 初始
// ============================================================

updateWSStatus();

updateComposer();

refreshFiles();

</script>
